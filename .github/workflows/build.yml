name: 构建与发布

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".gitattributes"
      - "LICENSE.txt"
      - ".vscode/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - build
          - release
          - prerelease

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    outputs:
      build_type: ${{ steps.classify.outputs.build_type }}
      version: ${{ steps.classify.outputs.version }}
      is_release: ${{ steps.classify.outputs.is_release }}
      is_prerelease: ${{ steps.classify.outputs.is_prerelease }}
      prerelease_tag: ${{ steps.classify.outputs.prerelease_tag }}
      artifact_name: ${{ steps.classify.outputs.artifact_name }}

    steps:
      # ── 1. 检出代码 ──
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. 配置 Python 3.12.9 ──
      - name: 配置 Python 3.12.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"

      # ── 3. 安装依赖 ──
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ordered-set zstandard

      # ── 4. 判定构建类型 ──────────────────────────────────────
      #  规则（不区分大小写）：
      #   - "Pass" 前缀         → skip        (跳过编译)
      #   - "v" + "Beta/Alpha"  → prerelease  (预发布)
      #   - "v" + 纯数字版本     → release     (正式发布)
      #   - 其他                → build       (仅构建)
      # ─────────────────────────────────────────────────────────
      - name: 判定构建类型
        id: classify
        shell: bash
        run: |
          # 获取提交信息
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          FIRST_LINE="$(echo "$COMMIT_MSG" | head -1)"
          echo "[信息] 提交信息: $FIRST_LINE"

          # 手动触发时使用指定类型
          MANUAL_TYPE="${{ inputs.build_type }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$MANUAL_TYPE" != "auto" ]; then
            BT="$MANUAL_TYPE"
            VER="0.0.0"
            PRE_TAG=""
            IS_REL="false"
            IS_PRE="false"
            case "$BT" in
              skip)       echo "::notice::手动触发 — 跳过编译" ;;
              build)      echo "::notice::手动触发 — 仅构建" ;;
              release)    IS_REL="true" ;&
              prerelease) IS_PRE="true" ;;
            esac
            echo "build_type=$BT" >> $GITHUB_OUTPUT
            echo "version=$VER" >> $GITHUB_OUTPUT
            echo "is_release=$IS_REL" >> $GITHUB_OUTPUT
            echo "is_prerelease=$IS_PRE" >> $GITHUB_OUTPUT
            echo "prerelease_tag=$PRE_TAG" >> $GITHUB_OUTPUT
            echo "artifact_name=RoboCopy-GUI-$BT" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 规则1: "Pass" 前缀（不区分大小写）→ 跳过编译
          if echo "$FIRST_LINE" | grep -qiE '^pass'; then
            echo "::notice::提交以 'Pass' 开头 → 跳过编译"
            echo "build_type=skip" >> $GITHUB_OUTPUT
            echo "version=0.0.0" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "prerelease_tag=" >> $GITHUB_OUTPUT
            echo "artifact_name=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 规则2/3: "v" 前缀 → 解析版本
          # 匹配: v<主版本>[.<次版本>[.<补丁版本>]][-Alpha|Beta<N>]  全部不区分大小写
          if echo "$FIRST_LINE" | grep -qiE '^v[0-9]+'; then
            # 提取版本号: v1.2.3 → 1.2.3, v1 → 1.0.0
            MAJOR=$(echo "$FIRST_LINE" | sed -nE 's/^[vV]([0-9]+).*/\1/p')
            MINOR=$(echo "$FIRST_LINE" | sed -nE 's/^[vV][0-9]+\.([0-9]+).*/\1/p')
            PATCH=$(echo "$FIRST_LINE" | sed -nE 's/^[vV][0-9]+\.[0-9]+\.([0-9]+).*/\1/p')
            MAJOR="${MAJOR:-0}"
            MINOR="${MINOR:-0}"
            PATCH="${PATCH:-0}"
            VERSION="${MAJOR}.${MINOR}.${PATCH}"

            # 检查是否包含 Beta 或 Alpha（不区分大小写）
            if echo "$FIRST_LINE" | grep -qiE '(beta|alpha)'; then
              # 预发布
              PRE_TAG=$(echo "$FIRST_LINE" | sed -nE 's/.*[\.\-]?(Alpha|Beta)[\.\-]?([0-9]*).*/\1\2/pI')
              PRE_TAG="${PRE_TAG:-Beta}"
              echo "::notice::预发布版本: v${VERSION}-${PRE_TAG}"
              echo "build_type=prerelease" >> $GITHUB_OUTPUT
              echo "is_release=false" >> $GITHUB_OUTPUT
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
              ARTIFACT="RoboCopy-GUI-v${VERSION}-${PRE_TAG}"
            else
              # 正式发布
              echo "::notice::正式发布版本: v${VERSION}"
              echo "build_type=release" >> $GITHUB_OUTPUT
              echo "is_release=true" >> $GITHUB_OUTPUT
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
              PRE_TAG=""
              ARTIFACT="RoboCopy-GUI-v${VERSION}"
            fi

            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "prerelease_tag=${PRE_TAG}" >> $GITHUB_OUTPUT
            echo "artifact_name=${ARTIFACT}" >> $GITHUB_OUTPUT
          else
            # 规则4: 其他 → 仅构建
            SHORT_HASH="$(git rev-parse --short HEAD)"
            echo "::notice::非版本提交 → 仅构建 (${SHORT_HASH})"
            echo "build_type=build" >> $GITHUB_OUTPUT
            echo "version=0.0.0" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "prerelease_tag=" >> $GITHUB_OUTPUT
            echo "artifact_name=RoboCopy-GUI-${SHORT_HASH}" >> $GITHUB_OUTPUT
          fi

      # ── 5. Nuitka 编译 ──
      - name: Nuitka 编译
        if: steps.classify.outputs.build_type != 'skip'
        shell: bash
        run: |
          ARTIFACT="${{ steps.classify.outputs.artifact_name }}"
          echo "[信息] 产物名称: ${ARTIFACT}"

          # 清理旧产物
          rm -rf dist build release
          mkdir -p release

          # Nuitka 编译 (standalone 模式 + MSVC)
          python -m nuitka \
            --standalone \
            --msvc=latest \
            --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --windows-console-mode=disable \
            --include-package=qfluentwidgets \
            --include-package=loguru \
            --include-package=Core \
            --include-package=Views \
            --include-package=Widgets \
            --output-dir=./build \
            --output-filename="${ARTIFACT}.exe" \
            robocopy-gui.py

          # dist 目录名由入口脚本决定，即 robocopy-gui.dist
          DIST_DIR="./build/robocopy-gui.dist"
          echo "[信息] 产物目录: ${DIST_DIR}"
          ls -lh "${DIST_DIR}/${ARTIFACT}.exe"

          # 打包为 zip 用于分发
          cp -r "${DIST_DIR}" "./release/${ARTIFACT}"
          7z a "./release/${ARTIFACT}.zip" "./release/${ARTIFACT}/*" -r

          # 同时单独放 exe 方便直接下载
          cp "${DIST_DIR}/${ARTIFACT}.exe" "release/"

          echo "[完成] Nuitka 编译完成"
          echo "[完成] release/${ARTIFACT}.exe"
          echo "[完成] release/${ARTIFACT}.zip"

      # ── 6. 上传产物 ──
      - name: 上传产物
        if: steps.classify.outputs.build_type != 'skip'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.classify.outputs.artifact_name }}
          path: |
            release/*.exe
            release/*.zip
          retention-days: 30

      # ── 7. 创建发布（v 前缀提交） ──
      - name: 创建发布
        if: |
          (steps.classify.outputs.build_type == 'release' ||
           steps.classify.outputs.build_type == 'prerelease')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.classify.outputs.version }}
          name: "RoboCopy-GUI v${{ steps.classify.outputs.version }}${{ steps.classify.outputs.prerelease_tag || '' }}"
          prerelease: ${{ steps.classify.outputs.is_prerelease || 'false' }}
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
